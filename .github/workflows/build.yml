name: Build LOS23 Kernel zerolteskt G925S - v6 Real Branches

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout self
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          fetch-depth: 1

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android /usr/share/swift /opt/az
          df -h

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential curl flex wget libelf-dev libncurses5-dev libssl-dev python3 gcc-aarch64-linux-gnu device-tree-compiler cpio tar

      - name: Restore boot parts
        run: |
          if ls boot_part_* 1>/dev/null 2>&1; then cat boot_part_* > boot.img; echo "Merged boot.img"; fi
          ls -lh *.img 2>/dev/null || true

      - name: Download kernel tarball - Real branches lineage-20
        run: |
          rm -rf kernel.tar.gz kernel android_kernel*
          mkdir -p kernel
          # Real branches from samsungexynos7420 are lineage-20, lineage-20-new, lineage-19.1 etc, NOT lineage-20.0
          for branch in lineage-20 lineage-20-new lineage-19.1 lineage-18.1 main master; do
            echo "Trying samsungexynos7420 android_kernel_samsung_exynos7420 branch $branch"
            rm -rf kernel.tar.gz android_kernel*
            curl -L --retry 3 -f https://github.com/samsungexynos7420/android_kernel_samsung_exynos7420/archive/refs/heads/$branch.tar.gz -o kernel.tar.gz && tar xzf kernel.tar.gz && ls && mv android_kernel_samsung_exynos7420-$branch/* kernel/ 2>/dev/null || mv android_kernel_samsung_exynos7420-*/ * kernel/ 2>/dev/null || true
            if [ -f kernel/Makefile ]; then echo "Success $branch"; break; fi
          done
          if [ ! -f kernel/Makefile ]; then
            echo "Trying LineageOS kernel repo"
            for branch in lineage-20 lineage-20.0 lineage-21.0 lineage-19.1 main; do
              echo "Trying LineageOS branch $branch"
              rm -rf kernel.tar.gz android_kernel*
              curl -L --retry 3 -f https://github.com/LineageOS/android_kernel_samsung_exynos7420/archive/refs/heads/$branch.tar.gz -o kernel.tar.gz && tar xzf kernel.tar.gz && mv android_kernel_samsung_exynos7420-$branch/* kernel/ 2>/dev/null || mv android_kernel*/ * kernel/ 2>/dev/null || true
              if [ -f kernel/Makefile ]; then echo "Success LineageOS $branch"; break; fi
            done
          fi
          if [ ! -f kernel/Makefile ]; then
            echo "Trying universal7420 common kernel"
            for branch in lineage-20 lineage-20-new lineage-19.1 main; do
              echo "Trying universal7420 $branch"
              rm -rf kernel.tar.gz *universal7420*
              curl -L --retry 3 -f https://github.com/samsungexynos7420/android_kernel_samsung_universal7420/archive/refs/heads/$branch.tar.gz -o kernel.tar.gz && tar xzf kernel.tar.gz && mv android_kernel_samsung_universal7420-$branch/* kernel/ 2>/dev/null || mv *universal7420*/* kernel/ 2>/dev/null || true
              if [ -f kernel/Makefile ]; then echo "Success universal7420 $branch"; break; fi
            done
          fi
          ls -lh kernel/ | head -30
          if [ ! -f kernel/Makefile ]; then echo "ERROR: All downloads failed"; ls -lh; exit 1; fi
          ls kernel/arch/arm64/configs/ | grep -E "7420|zerolte" | head -20

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make exynos7420-zerolteskt_defconfig || make exynos7420-zeroltexx_defconfig || make exynos7420-zeroflte_defconfig || make exynos7420-zero_defconfig
          make -j$(nproc --all) Image dtbs || make -j4 Image
          mkdir -p ../out_kernel
          cp arch/arm64/boot/Image ../out_kernel/ 2>/dev/null || cp arch/arm/boot/zImage ../out_kernel/ 2>/dev/null || true
          find arch/arm64/boot/dts -name "*.dtb" -exec cp {} ../out_kernel/ \; 2>/dev/null || true
          ls -lh ../out_kernel/

      - name: Repack
        run: |
          curl -sL https://github.com/topjohnwu/Magisk/releases/download/v27.0/magisk-27.0.apk -o magisk.apk || true
          unzip -q magisk.apk lib/arm64-v8a/libmagiskboot.so -d magisk_tmp 2>/dev/null || true
          cp magisk_tmp/lib/arm64-v8a/libmagiskboot.so ./magiskboot 2>/dev/null || wget -q https://github.com/ooki/magiskboot_build/raw/master/magiskboot -O magiskboot || true
          chmod +x magiskboot || true
          if [ -f boot.img ] && [ -f ./magiskboot ]; then
            ./magiskboot unpack boot.img || true
            cp out_kernel/Image kernel 2>/dev/null || cp out_kernel/zImage kernel 2>/dev/null || true
            ./magiskboot repack boot.img new-boot-lOS23-zerolteskt.img || true
            mkdir -p out_final
            cp new-boot*.img out_final/ 2>/dev/null || true
          else
            mkdir -p out_final
            cp -r out_kernel/* out_final/ || true
          fi
          ls -lh out_final/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-los23-zerolteskt-G925S
          path: out_final/
